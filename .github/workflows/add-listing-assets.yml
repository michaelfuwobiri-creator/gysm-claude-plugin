name: add-listing-assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the GYSM logo, privacy URL and marketplace description
        run: |
          curl -fsSL https://www.gysm.io/icons/icon-512.png -o .claude-plugin/icon.png
          file .claude-plugin/icon.png
          jq '.privacyPolicyUrl = "https://www.gysm.io/privacy"' .claude-plugin/plugin.json > t.json && mv t.json .claude-plugin/plugin.json
          jq '.metadata.description = "GYSM plugin for Claude: plan and build web apps and online stores from plain English."' .claude-plugin/marketplace.json > t.json && mv t.json .claude-plugin/marketplace.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add GYSM logo icon, privacy policy URL and marketplace description"
          git push
